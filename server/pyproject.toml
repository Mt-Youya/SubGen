[project]
name = "subgen-server"
version = "0.1.0"
description = "Video subtitle generation CLI — Whisper ASR + translation"
requires-python = ">=3.13"
dependencies = [
    "openai-whisper>=20250625",
    "deep-translator>=1.11.4",
    "tqdm>=4.67.3",
    "ffmpeg-python>=0.2.0",
    "torch>=2.11.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
subgen = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"
