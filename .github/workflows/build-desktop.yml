name: Build Desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64

          - os: macos-latest
            platform: macos
            args: "--target universal-apple-darwin"

          - os: windows-latest
            platform: windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          # tag 格式: desktop-v1.2.3 → 提取 1.2.3，手动触发时用 Cargo.toml 现有版本
          if [[ "$GITHUB_REF_NAME" == desktop-v* ]]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          else
            VERSION=$(grep '^version' packages/desktop/src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # 更新 tauri.conf.json
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" packages/desktop/src-tauri/tauri.conf.json
          # 更新 Cargo.toml（第一个 version 行）
          sed -i.bak "0,/^version = .*/s/^version = .*/version = \"$VERSION\"/" packages/desktop/src-tauri/Cargo.toml
          rm -f packages/desktop/src-tauri/tauri.conf.json.bak packages/desktop/src-tauri/Cargo.toml.bak
          echo "Build version: $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ffmpeg

      - name: Install macOS whisper-cpp (Metal) + ffmpeg
        if: matrix.platform == 'macos'
        run: |
          mkdir -p packages/desktop/src-tauri/resources

          # ── 从源码编译 whisper.cpp（Metal 加速）──
          brew install cmake pkg-config
          WHISPER_TAG=$(curl -s https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest | jq -r .tag_name)
          echo "Using whisper.cpp tag: $WHISPER_TAG"
          git clone --depth=1 --branch "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp
          cmake -B build \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_SERVER=ON \
            -DWHISPER_BUILD_TESTS=OFF
          cmake --build build --target whisper-server whisper-cli -j$(sysctl -n hw.logicalcpu)
          cd ..

          # 复制二进制
          cp whisper.cpp/build/bin/whisper-server packages/desktop/src-tauri/resources/
          cp whisper.cpp/build/bin/whisper-cli packages/desktop/src-tauri/resources/

          # 复制 dylib（从 build 目录找，兼容版本号变化）
          cp "$(find whisper.cpp/build -name 'libwhisper.*.dylib' -type f | head -1)" \
             packages/desktop/src-tauri/resources/libwhisper.1.dylib
          cp "$(find whisper.cpp/build -name 'libggml.0.*.dylib' -type f | head -1)" \
             packages/desktop/src-tauri/resources/libggml.0.dylib
          cp "$(find whisper.cpp/build -name 'libggml-base.0.*.dylib' -type f | head -1)" \
             packages/desktop/src-tauri/resources/libggml-base.0.dylib
          cp "$(find whisper.cpp/build -name 'libggml-metal.0.*.dylib' -type f | head -1)" \
             packages/desktop/src-tauri/resources/libggml-metal.0.dylib

          # 复制 Metal shader
          cp "$(find whisper.cpp/build -name 'ggml-metal.metal' -type f | head -1)" \
             packages/desktop/src-tauri/resources/

          # ── ffmpeg ──
          curl -L "https://evermeet.cx/ffmpeg/get/ffmpeg/zip" -o ffmpeg-mac.zip
          unzip -o ffmpeg-mac.zip -d ffmpeg-mac
          cp ffmpeg-mac/ffmpeg packages/desktop/src-tauri/resources/ffmpeg
          rm -rf ffmpeg-mac ffmpeg-mac.zip
          chmod +x packages/desktop/src-tauri/resources/ffmpeg
          codesign --force --sign - packages/desktop/src-tauri/resources/ffmpeg || true

          # ── 修改 rpath 为 @loader_path ──
          for bin in whisper-cli whisper-server; do
            for lib in libwhisper.1 libggml.0 libggml-base.0 libggml-metal.0; do
              dylib="${lib}.dylib"
              old_path=$(otool -L packages/desktop/src-tauri/resources/$bin | grep "$dylib" | awk '{print $1}' | head -1)
              if [ -n "$old_path" ]; then
                install_name_tool -change "$old_path" "@loader_path/$dylib" \
                  packages/desktop/src-tauri/resources/$bin
              fi
            done
            codesign --force --sign - packages/desktop/src-tauri/resources/$bin
          done

          # 修复 dylib 之间的 @rpath 依赖
          install_name_tool -change "$(otool -L packages/desktop/src-tauri/resources/libggml.0.dylib | grep 'libggml-base' | awk '{print $1}' | head -1)" \
            "@loader_path/libggml-base.0.dylib" packages/desktop/src-tauri/resources/libggml.0.dylib 2>/dev/null || true
          install_name_tool -change "$(otool -L packages/desktop/src-tauri/resources/libggml-metal.0.dylib | grep 'libggml.0' | awk '{print $1}' | head -1)" \
            "@loader_path/libggml.0.dylib" packages/desktop/src-tauri/resources/libggml-metal.0.dylib 2>/dev/null || true
          install_name_tool -change "$(otool -L packages/desktop/src-tauri/resources/libggml-metal.0.dylib | grep 'libggml-base' | awk '{print $1}' | head -1)" \
            "@loader_path/libggml-base.0.dylib" packages/desktop/src-tauri/resources/libggml-metal.0.dylib 2>/dev/null || true

          # ── 签名所有二进制 ──
          codesign --force --sign - packages/desktop/src-tauri/resources/libwhisper.1.dylib
          codesign --force --sign - packages/desktop/src-tauri/resources/libggml.0.dylib
          codesign --force --sign - packages/desktop/src-tauri/resources/libggml-base.0.dylib
          codesign --force --sign - packages/desktop/src-tauri/resources/libggml-metal.0.dylib
          codesign --force --sign - packages/desktop/src-tauri/resources/ffmpeg

      - name: Install Windows whisper-cpp + ffmpeg
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          mkdir -p packages/desktop/src-tauri/resources
          # 下载 whisper.cpp 预编译 Windows 版本
          $version = (Invoke-RestMethod "https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest").tag_name
          $whisper_url = "https://github.com/ggml-org/whisper.cpp/releases/download/$version/whisper-bin-x64.zip"
          Invoke-WebRequest -Uri $whisper_url -OutFile whisper-tmp.zip
          Expand-Archive -Path whisper-tmp.zip -DestinationPath whisper-tmp -Force
          Copy-Item whisper-tmp/Release/whisper-server.exe packages/desktop/src-tauri/resources/
          Copy-Item whisper-tmp/Release/whisper-cli.exe packages/desktop/src-tauri/resources/
          # 复制所有 dll（whisper.dll + ggml*.dll，兼容各版本）
          Get-ChildItem whisper-tmp/Release/*.dll | Copy-Item -Destination packages/desktop/src-tauri/resources/
          Remove-Item -Recurse -Force whisper-tmp, whisper-tmp.zip
          # 下载 ffmpeg 静态编译版
          $ffmpeg_url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpeg_url -OutFile ffmpeg-tmp.zip
          Expand-Archive -Path ffmpeg-tmp.zip -DestinationPath ffmpeg-tmp -Force
          $ffmpeg_exe = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpeg_exe.FullName packages/desktop/src-tauri/resources/
          Remove-Item -Recurse -Force ffmpeg-tmp, ffmpeg-tmp.zip

      - name: Install Linux whisper-cpp + ffmpeg
        if: matrix.platform == 'linux-x64'
        run: |
          mkdir -p packages/desktop/src-tauri/resources
          # ffmpeg 静态版
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
               -o ffmpeg-linux.tar.xz
          tar -xf ffmpeg-linux.tar.xz
          find ffmpeg-master-latest-linux64-gpl -name "ffmpeg" -type f | head -1 | xargs -I{} cp {} packages/desktop/src-tauri/resources/ffmpeg
          rm -rf ffmpeg-master-latest-linux64-gpl ffmpeg-linux.tar.xz
          chmod +x packages/desktop/src-tauri/resources/ffmpeg
          # 从源码编译 whisper.cpp（锁定与 Windows/macOS 一致的版本）
          sudo apt-get install -y cmake build-essential
          WHISPER_TAG=$(curl -sL --retry 3 -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest" \
            | grep '"tag_name"' | cut -d'"' -f4)
          # fallback：API 限流或网络失败时用已知稳定版
          if [ -z "$WHISPER_TAG" ]; then
            WHISPER_TAG="v1.8.4"
            echo "Warning: could not fetch latest whisper.cpp tag, falling back to $WHISPER_TAG"
          fi
          echo "Using whisper.cpp tag: $WHISPER_TAG"
          git clone --depth=1 --branch "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp
          cmake -B build -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=ON
          cmake --build build --target whisper-server whisper-cli -j$(nproc)
          cp build/bin/whisper-server build/bin/whisper-cli ../packages/desktop/src-tauri/resources/
          chmod +x ../packages/desktop/src-tauri/resources/whisper-server ../packages/desktop/src-tauri/resources/whisper-cli

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "SubGen Desktop ${{ github.ref_name }}"
          releaseBody: "See the assets below for your platform."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
